<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heladería POS v9.2 - Estable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f2f2f7; user-select: none; -webkit-tap-highlight-color: transparent; }
        .apple-card { background: white; border-radius: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-press:active { transform: scale(0.96); background-color: #e5e5ea; }
        .modal-bg { background-color: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
        .counter-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: #f3f4f6; border-radius: 10px; font-weight: bold; }
        .scroll-beauty::-webkit-scrollbar { width: 4px; }
        .scroll-beauty::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 10px; }
    </style>
</head>
<body class="p-4 pb-28 text-gray-800">
    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black tracking-tight">Heladería 🍦</h1>
            <div class="flex gap-2">
                <button onclick="abrirGastos()" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">💸</button>
                <button onclick="abrirHistorialDias()" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">📅</button>
                <button onclick="abrirBitacora()" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">📜</button>
                <button onclick="abrirAjustes()" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">⚙️</button>
            </div>
        </header>

        <!-- PANTALLA TOTAL -->
        <div class="apple-card p-8 mb-6 text-center border-b-4 border-blue-500">
            <span class="text-gray-400 text-[10px] font-black uppercase tracking-[0.2em] block mb-2">Total de la Venta</span>
            <div id="displayTotal" class="text-6xl font-black my-2 text-gray-900 tracking-tighter">$0.00</div>
            <div id="displayLista" class="text-gray-400 text-xs font-medium h-4 truncate italic">Caja lista...</div>
            
            <div class="grid grid-cols-2 gap-4 mt-6">
                <button onclick="abrirPago()" class="bg-green-500 text-white font-black py-5 rounded-[20px] btn-press text-lg uppercase tracking-widest">Cobrar</button>
                <button onclick="borrarUltimo()" class="bg-gray-100 text-gray-500 font-bold py-5 rounded-[20px] btn-press text-2xl">←</button>
            </div>
        </div>

        <!-- PRODUCTOS -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button onclick="add('V8', 60)" class="apple-card p-5 btn-press text-left border-l-8 border-blue-400">
                <div class="text-[10px] font-black uppercase text-blue-500">Vainilla 8oz</div>
                <div class="text-2xl font-black">$60</div>
            </button>
            <button onclick="add('C8', 60)" class="apple-card p-5 btn-press text-left border-l-8 border-orange-900">
                <div class="text-[10px] font-black uppercase text-orange-900">Choco 8oz</div>
                <div class="text-2xl font-black">$60</div>
            </button>
            <button onclick="add('V16', 110)" class="apple-card p-5 btn-press text-left border-l-8 border-blue-400">
                <div class="text-[10px] font-black uppercase text-blue-500">Vainilla 16oz</div>
                <div class="text-2xl font-black">$110</div>
            </button>
            <button onclick="add('C16', 130)" class="apple-card p-5 btn-press text-left border-l-8 border-orange-900">
                <div class="text-[10px] font-black uppercase text-orange-900">Choco 16oz</div>
                <div class="text-2xl font-black">$130</div>
            </button>
        </div>

        <div id="gridPromos" class="grid grid-cols-1 gap-3 mb-24"></div>
        <button onclick="abrirResumen()" class="fixed bottom-6 left-6 right-6 bg-blue-600 text-white py-5 rounded-[22px] font-black text-lg shadow-2xl btn-press z-10">Ver Resumen Hoy</button>
    </div>

    <!-- MODAL GASTOS -->
    <div id="modalGastos" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-sm rounded-[35px] p-8 shadow-2xl flex flex-col max-h-[85vh]">
            <h3 class="text-2xl font-black mb-4 text-center">Nuevo Gasto</h3>
            <div class="space-y-3 overflow-y-auto pr-2 scroll-beauty">
                <input id="gProv" type="text" placeholder="Proveedor (Costco, Brenda...)" class="w-full p-4 bg-gray-50 rounded-2xl font-bold text-sm border-0">
                <select id="gMet" class="w-full p-4 bg-gray-50 rounded-2xl font-bold text-sm border-0">
                    <option value="Efectivo">Efectivo</option>
                    <option value="Débito">Débito</option>
                </select>
                <select id="gIns" onchange="sugerirGasto()" class="w-full p-4 bg-gray-50 rounded-2xl font-bold text-sm border-0">
                    <option value="">¿Qué compraste?</option>
                    <option value="Leche" data-p="279">Leche (12kg)</option>
                    <option value="Huevo" data-p="65">Huevo (30 pzs)</option>
                    <option value="Crema" data-p="75.85">Crema (900g)</option>
                    <option value="Azúcar" data-p="69">Azúcar (2kg)</option>
                </select>
                <div class="grid grid-cols-2 gap-3">
                    <input id="gCan" type="number" value="1" oninput="sugerirGasto()" class="p-4 bg-gray-50 rounded-2xl font-bold text-center border-0">
                    <input id="gTot" type="number" step="0.01" class="p-4 bg-yellow-50 rounded-2xl font-black text-center text-blue-600 border-0">
                </div>
                <button onclick="guardarGasto()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black btn-press">Registrar Gasto</button>
            </div>
            <button onclick="cerrarModal('modalGastos')" class="mt-4 text-gray-400 font-bold uppercase text-[10px]">Cerrar</button>
        </div>
    </div>

    <!-- MODAL AJUSTES -->
    <div id="modalAjustes" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-sm rounded-[30px] p-8 max-h-[85vh] overflow-y-auto shadow-2xl scroll-beauty text-center">
            <h3 class="text-2xl font-black mb-6">Ajustes</h3>
            <div class="bg-blue-50 p-5 rounded-[25px] mb-6 text-center">
                <label class="text-[10px] font-black text-blue-400 uppercase block mb-3">Nuevo Botón Promo</label>
                <input id="pNom" type="text" placeholder="Nombre" class="w-full p-4 rounded-2xl mb-2 font-bold border-0 shadow-sm">
                <input id="pPre" type="number" placeholder="Precio $" class="w-full p-4 rounded-2xl mb-4 font-bold border-0 shadow-sm">
                <div id="contadoresPromo" class="grid grid-cols-3 gap-2 mb-6"></div>
                <button onclick="guardarNuevaPromo()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black btn-press text-sm">Crear Botón</button>
            </div>
            <div id="listaPromosGestion" class="space-y-2 mb-6"></div>
            <button onclick="cerrarModal('modalAjustes')" class="w-full py-2 text-gray-300 font-bold uppercase text-xs">Cerrar</button>
        </div>
    </div>

    <!-- MODAL RESUMEN -->
    <div id="modalResumen" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-sm rounded-[35px] p-8 shadow-2xl relative text-center">
            <div id="resumenContent" class="min-h-[300px] flex flex-col justify-center"></div>
            <div class="flex justify-between mt-8"><button onclick="cambiarPagina(-1)" class="bg-gray-100 p-5 rounded-full">←</button><button onclick="cambiarPagina(1)" class="bg-gray-100 p-5 rounded-full">→</button></div>
            <button onclick="abrirConfirmReset()" class="w-full mt-10 text-[10px] text-red-400 font-black uppercase">Cerrar Caja y Guardar Día</button>
            <button onclick="cerrarModal('modalResumen')" class="absolute top-6 right-6 text-gray-300 text-2xl">×</button>
        </div>
    </div>

    <!-- MODAL PAGO -->
    <div id="modalPago" class="fixed inset-0 modal-bg hidden items-end justify-center z-50"><div class="bg-white w-full max-w-md rounded-t-[40px] p-10"><h3 class="text-2xl font-black mb-8 text-center">Forma de Pago</h3><div class="space-y-4"><button onclick="finalizar('Efectivo')" class="w-full py-6 bg-gray-50 rounded-2xl font-black text-xl text-left px-12">💵 Efectivo</button><button onclick="finalizar('Terminal')" class="w-full py-6 bg-gray-50 rounded-2xl font-black text-xl text-left px-12 text-blue-600 border-l-8 border-blue-500">💳 Terminal</button><button onclick="finalizar('Transferencia')" class="w-full py-6 bg-gray-50 rounded-2xl font-black text-xl text-left px-12">🏦 Transferencia</button><button onclick="cerrarModal('modalPago')" class="w-full py-6 text-red-500 font-black">Cancelar</button></div></div></div>

    <script>
        // ¡REEMPLAZA ESTA URL!
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxC1dHG4fBNlMHzQXhpK8JHQNKtcVnSM4E91-yupBukv7sNqXE0N3hzYSEU8LE7s0mpVA/exec";

        const tiposInv = ['V8','C8','V16','C16','V32','C32'];
        let carrito = [];
        let pagActual = 0;
        let recetaPromoNueva = { V8:0, C8:0, V16:0, C16:0, V32:0, C32:0 };

        let db = JSON.parse(localStorage.getItem('heladeria_v9_stable')) || {
            inv: { V8:0, C8:0, V16:0, C16:0, V32:0, C32:0 },
            dinero: { efec:0, term:0, tran:0 },
            bitacora: [],
            gastos: [],
            promosConfig: [],
            reportesPasados: []
        };

        function add(tipo, precio, receta = null) {
            carrito.push({ tipo, precio: Number(precio), receta });
            actualizarUI();
        }

        function actualizarUI() {
            let total = carrito.reduce((a, b) => a + Number(b.precio), 0);
            document.getElementById('displayTotal').innerText = `$${total.toFixed(2)}`;
            document.getElementById('displayLista').innerText = (carrito.length > 0 ? carrito.map(i => i.tipo).join(' + ') : "Esperando...");
        }

        function renderContadoresReceta() {
            const cont = document.getElementById('contadoresPromo');
            if(!cont) return;
            cont.innerHTML = "";
            tiposInv.forEach(t => {
                cont.innerHTML += `<div class="bg-white p-2 rounded-xl shadow-sm border border-blue-50"><div class="text-[8px] font-black">${t}</div><div class="flex items-center justify-center gap-1"><button onclick="cambiarRecetaPromo('${t}',-1)" class="text-gray-300 font-bold">-</button><span id="receta${t}" class="text-xs font-black">0</span><button onclick="cambiarRecetaPromo('${t}',1)" class="text-blue-500 font-bold">+</button></div></div>`;
            });
        }

        function cambiarRecetaPromo(t, c) { recetaPromoNueva[t] = Math.max(0, recetaPromoNueva[t] + c); document.getElementById('receta'+t).innerText = recetaPromoNueva[t]; }

        function guardarNuevaPromo() {
            let n = document.getElementById('pNom').value;
            let p = document.getElementById('pPre').value;
            if(n && p) {
                db.promosConfig.push({ nombre: n, precio: Number(p), receta: {...recetaPromoNueva} });
                guardarDB(); renderPromosMain(); cerrarModal('modalAjustes');
                recetaPromoNueva = { V8:0, C8:0, V16:0, C16:0, V32:0, C32:0 };
            }
        }

        function renderPromosMain() {
            const g = document.getElementById('gridPromos');
            g.innerHTML = "";
            db.promosConfig.forEach((p, idx) => {
                const btn = document.createElement('button');
                btn.className = "apple-card p-5 flex justify-between items-center btn-press border-l-8 border-blue-600 shadow-sm";
                btn.onclick = () => add(p.nombre, p.precio, p.receta);
                btn.innerHTML = `<span class="font-black text-sm text-gray-700">${p.nombre}</span><b class="text-blue-600 text-xl font-black">$${Number(p.precio).toFixed(2)}</b>`;
                g.appendChild(btn);
            });
        }

        function finalizar(metodo) {
            let totalV = carrito.reduce((a, b) => a + Number(b.precio), 0);
            const fecha = new Date().toLocaleDateString();
            const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ tipoAccion: "VENTA", fecha, hora, monto: totalV.toFixed(2), metodo, detalle: carrito.map(i => i.tipo).join(', ') }) });

            if(metodo === 'Efectivo') db.dinero.efec += totalV;
            else if(metodo === 'Terminal') db.dinero.term += totalV;
            else if(metodo === 'Transferencia') db.dinero.tran += totalV;

            db.bitacora.push({ hora, monto: totalV, metodo, detalle: carrito.map(i => i.tipo).join(', ') });
            carrito.forEach(i => { 
                if(db.inv[i.tipo] !== undefined) db.inv[i.tipo]++;
                if(i.receta) { for(let h in i.receta) db.inv[h] += i.receta[h]; }
            });

            guardarDB(); carrito = []; actualizarUI(); cerrarModal('modalPago');
        }

        function guardarGasto() {
            const prov = document.getElementById('gProv').value || "S/P";
            const ins = document.getElementById('gIns').value;
            const monto = parseFloat(document.getElementById('gTot').value);
            if(!ins || !monto) return;
            fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ tipoAccion:"GASTO", fecha: new Date().toLocaleDateString(), proveedor: prov, metodo: document.getElementById('gMet').value, concepto: ins, monto: monto.toFixed(2), pagado: "SI" }) });
            db.gastos.push({ total: monto }); guardarDB(); cerrarModal('modalGastos'); alert("Gasto Guardado");
        }

        function abrirConfirmReset() {
            if(confirm("¿Cerrar el día?")) {
                const hoy = new Date().toLocaleDateString();
                const totalG = db.gastos.reduce((a, b) => a + b.total, 0);
                fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ tipoAccion: "CIERRE", fecha: hoy, efectivo: db.dinero.efec.toFixed(2), terminal: db.dinero.term.toFixed(2), transf: db.dinero.tran.toFixed(2), gastos: totalG.toFixed(2) }) }).then(() => {
                    db.reportesPasados.push({ fecha: hoy, total: (db.dinero.efec + db.dinero.term + db.dinero.tran - totalG) });
                    db.inv = { V8:0, C8:0, V16:0, C16:0, V32:0, C32:0 }; db.dinero = { efec:0, term:0, tran:0 }; db.bitacora = []; db.gastos = [];
                    guardarDB(); location.reload();
                });
            }
        }

        function renderResumen() {
            const cont = document.getElementById('resumenContent');
            let bruto = db.dinero.efec + db.dinero.term + db.dinero.tran;
            let totalG = db.gastos.reduce((a, b) => a + b.total, 0);
            if(pagActual === 0) cont.innerHTML = `<h4 class="font-black text-blue-500 mb-4">Ventas</h4><b class="text-4xl">$${bruto.toFixed(2)}</b>`;
            else if(pagActual === 1) cont.innerHTML = `<h4 class="font-black text-red-500 mb-4">Gastos</h4><b class="text-4xl text-red-600">$${totalG.toFixed(2)}</b>`;
            else cont.innerHTML = `<h4 class="font-black text-green-500 mb-4">Neto (50%)</h4><b class="text-4xl text-green-600">$${(bruto - (bruto * 0.5) - totalG).toFixed(2)}</b>`;
        }

        // --- FUNCIONES EXTRA ---
        function abrirAjustes() { document.getElementById('modalAjustes').style.display = 'flex'; renderContadoresReceta(); renderListaGestion(); }
        function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
        function abrirGastos() { document.getElementById('modalGastos').style.display = 'flex'; }
        function sugerirGasto() { const ins = document.getElementById('gIns'); const p = ins.options[ins.selectedIndex].getAttribute('data-p'); document.getElementById('gTot').value = (p * document.getElementById('gCan').value).toFixed(2); }
        function abrirResumen() { pagActual = 0; document.getElementById('modalResumen').style.display = 'flex'; renderResumen(); }
        function cambiarPagina(d) { pagActual = Math.max(0, Math.min(2, pagActual + d)); renderResumen(); }
        function guardarDB() { localStorage.setItem('heladeria_v9_stable', JSON.stringify(db)); }
        function abrirPago() { if(carrito.length > 0) document.getElementById('modalPago').style.display = 'flex'; }
        function borrarUltimo() { carrito.pop(); actualizarUI(); }
        function abrirBitacora() { document.getElementById('modalBitacora').style.display = 'flex'; }
        function abrirHistorialDias() { document.getElementById('modalHistorialDias').style.display = 'flex'; }
        function renderListaGestion() { const l = document.getElementById('listaPromosGestion'); l.innerHTML = ""; db.promosConfig.forEach((p, i) => { l.innerHTML += `<div class="flex justify-between p-2 bg-gray-50 rounded-xl mb-1 text-xs"><span>${p.nombre}</span><button onclick="db.promosConfig.splice(${i},1);guardarDB();renderPromosMain();renderListaGestion();" class="text-red-500">×</button></div>`; }); }

        renderPromosMain();
    </script>
</body>
</html>
