<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heladería POS v9.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f2f2f7; user-select: none; -webkit-tap-highlight-color: transparent; }
        .apple-card { background: white; border-radius: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-press:active { transform: scale(0.95); background-color: #e5e5ea; }
        .modal-bg { background-color: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 100; }
        .scroll-beauty::-webkit-scrollbar { width: 4px; }
        .scroll-beauty::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 10px; }
    </style>
</head>
<body class="p-4 pb-28 text-gray-800">
    <div class="max-w-md mx-auto">
        <!-- CABECERA -->
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-blue-600">Heladería 🍦</h1>
            <div class="flex gap-2">
                <button onclick="verMod('mGasto')" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">💸</button>
                <button onclick="verMod('mAjuste')" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">⚙️</button>
            </div>
        </header>

        <!-- PANTALLA TOTAL -->
        <div class="apple-card p-8 mb-6 text-center border-b-4 border-blue-500">
            <span class="text-gray-400 text-[10px] font-black uppercase mb-2 block tracking-widest">Total Venta</span>
            <div id="txtTotal" class="text-6xl font-black my-2 text-gray-900 tracking-tighter">$0.00</div>
            <div id="txtLista" class="text-gray-400 text-xs italic truncate">Esperando...</div>
            
            <div class="grid grid-cols-2 gap-4 mt-6">
                <button onclick="verMod('mPago')" class="bg-green-500 text-white font-black py-5 rounded-[20px] btn-press text-lg uppercase tracking-widest">Cobrar</button>
                <button onclick="limpiarUltimo()" class="bg-gray-100 text-gray-500 font-bold py-5 rounded-[20px] btn-press text-2xl">←</button>
            </div>
        </div>

        <!-- PRODUCTOS FIJOS -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button onclick="clickAdd('V8', 60)" class="apple-card p-5 btn-press text-left border-l-8 border-blue-400">
                <div class="text-[10px] font-black text-blue-400">VAINILLA 8oz</div>
                <div class="text-2xl font-black">$60</div>
            </button>
            <button onclick="clickAdd('C8', 60)" class="apple-card p-5 btn-press text-left border-l-8 border-orange-900">
                <div class="text-[10px] font-black text-orange-900">CHOCO 8oz</div>
                <div class="text-2xl font-black">$60</div>
            </button>
            <button onclick="clickAdd('V16', 110)" class="apple-card p-5 btn-press text-left border-l-8 border-blue-400">
                <div class="text-[10px] font-black text-blue-400">VAINILLA 16oz</div>
                <div class="text-2xl font-black">$110</div>
            </button>
            <button onclick="clickAdd('C16', 130)" class="apple-card p-5 btn-press text-left border-l-8 border-orange-900">
                <div class="text-[10px] font-black text-orange-900">CHOCO 16oz</div>
                <div class="text-2xl font-black">$130</div>
            </button>
        </div>

        <div id="boxPromos" class="grid grid-cols-1 gap-3 mb-24"></div>
        
        <button onclick="mostrarCierre()" class="fixed bottom-6 left-6 right-6 bg-blue-600 text-white py-5 rounded-[22px] font-black shadow-2xl btn-press uppercase z-40">Ver Resumen Hoy</button>
    </div>

    <!-- MODAL GASTOS -->
    <div id="mGasto" class="fixed inset-0 modal-bg hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[35px] p-8 shadow-2xl">
            <h3 class="text-2xl font-black mb-4 text-center">Gasto Nuevo</h3>
            <div class="space-y-4">
                <input id="gP" type="text" placeholder="Proveedor" class="w-full p-4 bg-gray-50 rounded-2xl font-bold border-0">
                <input id="gC" type="text" placeholder="Concepto (Ej: Leche)" class="w-full p-4 bg-gray-50 rounded-2xl font-bold border-0">
                <input id="gM" type="number" placeholder="Monto $" class="w-full p-4 bg-yellow-50 rounded-2xl font-black text-blue-600 border-0">
                <button onclick="runGasto()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black btn-press">Guardar</button>
                <button onclick="ocultarMod('mGasto')" class="w-full text-gray-300 font-bold text-[10px] uppercase mt-2">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- MODAL AJUSTES (PROMOS) -->
    <div id="mAjuste" class="fixed inset-0 modal-bg hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[30px] p-8 max-h-[85vh] overflow-y-auto">
            <h3 class="text-2xl font-black mb-6 text-center">Crear Promo</h3>
            <div class="bg-blue-50 p-5 rounded-[25px] mb-4">
                <input id="pName" type="text" placeholder="Nombre de Promo" class="w-full p-4 rounded-xl mb-2 font-bold border-0">
                <input id="pPrice" type="number" placeholder="Precio Final $" class="w-full p-4 rounded-xl mb-4 font-bold border-0">
                
                <p class="text-[9px] font-black text-gray-400 mb-2 uppercase">Incluye estos helados:</p>
                <div id="boxReceta" class="grid grid-cols-3 gap-2 mb-6"></div>
                
                <button onclick="runCrearPromo()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black">Crear Botón</button>
            </div>
            <div id="boxGestion" class="space-y-2"></div>
            <button onclick="ocultarMod('mAjuste')" class="w-full text-gray-300 font-bold text-xs mt-4">Cerrar</button>
        </div>
    </div>

    <!-- MODAL PAGO -->
    <div id="mPago" class="fixed inset-0 modal-bg hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-[40px] p-10">
            <h3 class="text-2xl font-black mb-8 text-center">Forma de Pago</h3>
            <div class="space-y-4">
                <button onclick="runPago('Efectivo')" class="w-full py-6 bg-gray-50 rounded-2xl font-black text-xl text-left px-12">💵 Efectivo</button>
                <button onclick="runPago('Terminal')" class="w-full py-6 bg-blue-50 rounded-2xl font-black text-xl text-left px-12 text-blue-600">💳 Terminal</button>
                <button onclick="ocultarMod('mPago')" class="w-full py-4 text-red-500 font-bold">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL RESUMEN -->
    <div id="mResumen" class="fixed inset-0 modal-bg hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[35px] p-8 text-center">
            <div id="boxResData" class="py-10"></div>
            <button onclick="runCierreCaja()" class="w-full bg-red-500 text-white py-5 rounded-2xl font-black mb-4 btn-press">Cerrar Día y Guardar</button>
            <button onclick="ocultarMod('mResumen')" class="text-gray-300 font-bold uppercase text-xs">Cerrar</button>
        </div>
    </div>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbxC1dHG4fBNlMHzQXhpK8JHQNKtcVnSM4E91-yupBukv7sNqXE0N3hzYSEU8LE7s0mpVA/exec";

        let cart = [];
        let invTypes = ['V8','C8','V16','C16','V32','C32'];
        let tempReceta = { V8:0, C8:0, V16:0, C16:0, V32:0, C32:0 };

        let db = JSON.parse(localStorage.getItem('ice_v94')) || {
            cash: 0, card: 0, 
            inventory: { V8:0, C8:0, V16:0, C16:0, V32:0, C32:0 },
            promos: [],
            spentToday: 0
        };

        function clickAdd(tipo, precio, receta = null) {
            cart.push({ tipo, precio, receta });
            updateUI();
        }

        function updateUI() {
            let total = cart.reduce((a, b) => a + b.precio, 0);
            document.getElementById('txtTotal').innerText = `$${total.toFixed(2)}`;
            document.getElementById('txtLista').innerText = cart.map(i => i.tipo).join(' + ') || "Caja vacía";
        }

        function limpiarUltimo() { cart.pop(); updateUI(); }

        function verMod(id) {
            document.getElementById(id).classList.remove('hidden');
            if(id === 'mAjuste') { renderReceta(); renderGestion(); }
        }
        function ocultarMod(id) { document.getElementById(id).classList.add('hidden'); }

        function renderReceta() {
            const box = document.getElementById('boxReceta');
            box.innerHTML = "";
            invTypes.forEach(t => {
                box.innerHTML += `<div class="bg-white p-2 rounded-xl shadow-sm border border-blue-50 text-center"><div class="text-[8px] font-black">${t}</div><div class="flex justify-center items-center gap-1"><button onclick="editRec('${t}',-1)">-</button><span id="recVal${t}" class="text-xs font-black">0</span><button onclick="editRec('${t}',1)">+</button></div></div>`;
            });
        }
        function editRec(t, val) { tempReceta[t] = Math.max(0, tempReceta[t] + val); document.getElementById('recVal'+t).innerText = tempReceta[t]; }

        function runCrearPromo() {
            let n = document.getElementById('pName').value;
            let p = parseFloat(document.getElementById('pPrice').value);
            if(!n || !p) return;
            db.promos.push({ nombre: n, precio: p, receta: {...tempReceta} });
            tempReceta = { V8:0, C8:0, V16:0, C16:0, V32:0, C32:0 };
            save(); renderPromos(); ocultarMod('mAjuste');
        }

        function renderPromos() {
            const box = document.getElementById('boxPromos');
            box.innerHTML = "";
            db.promos.forEach((p, idx) => {
                box.innerHTML += `<button onclick="clickAddPromo(${idx})" class="apple-card p-5 flex justify-between items-center btn-press border-l-8 border-blue-600"><span class="font-black text-gray-700 uppercase text-sm">${p.nombre}</span><b class="text-blue-600 text-xl font-black">$${p.precio}</b></button>`;
            });
        }
        function clickAddPromo(i) { let p = db.promos[i]; clickAdd(p.nombre, p.precio, p.receta); }

        function runPago(metodo) {
            let total = cart.reduce((a, b) => a + b.precio, 0);
            if(metodo === 'Efectivo') db.cash += total; else db.card += total;
            
            cart.forEach(i => {
                if(db.inventory[i.tipo] !== undefined) db.inventory[i.tipo]++;
                if(i.receta) { for(let k in i.receta) db.inventory[k] += i.receta[k]; }
            });

            fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({
                tipoAccion: "VENTA", fecha: new Date().toLocaleDateString(), hora: new Date().toLocaleTimeString(),
                monto: total, metodo, detalle: cart.map(i => i.tipo).join(',')
            })});

            save(); cart = []; updateUI(); ocultarMod('mPago'); alert("Cobrado");
        }

        function runGasto() {
            let m = parseFloat(document.getElementById('gM').value);
            if(!m) return;
            db.spentToday += m;
            fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({
                tipoAccion: "GASTO", fecha: new Date().toLocaleDateString(),
                proveedor: document.getElementById('gP').value, metodo: "Efectivo", 
                concepto: document.getElementById('gC').value, monto: m, pagado: "SI"
            })});
            save(); ocultarMod('mGasto'); alert("Gasto Guardado");
        }

        function mostrarCierre() {
            let bruto = db.cash + db.card;
            let apartado = bruto * 0.5;
            document.getElementById('boxResData').innerHTML = `
                <div class="text-left space-y-3">
                    <div class="flex justify-between font-bold"><span>Bruto:</span> <span>$${bruto.toFixed(2)}</span></div>
                    <div class="flex justify-between text-orange-500 font-bold"><span>Apartado 50%:</span> <span>-$${apartado.toFixed(2)}</span></div>
                    <div class="flex justify-between text-red-500 font-bold"><span>Gastos:</span> <span>-$${db.spentToday.toFixed(2)}</span></div>
                    <div class="flex justify-between text-4xl font-black pt-4 border-t text-green-600"><span>NETO:</span> <span>$${(bruto - apartado - db.spentToday).toFixed(2)}</span></div>
                </div>`;
            verMod('mResumen');
        }

        function runCierreCaja() {
            if(!confirm("¿Cerrar Día?")) return;
            fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({
                tipoAccion: "CIERRE", fecha: new Date().toLocaleDateString(),
                efectivo: db.cash, terminal: db.card, transf: 0,
                gastos: db.spentToday, neto: ( (db.cash + db.card) * 0.5 - db.spentToday)
            })}).then(() => {
                db.cash = 0; db.card = 0; db.spentToday = 0;
                db.inventory = { V8:0, C8:0, V16:0, C16:0, V32:0, C32:0 };
                save(); location.reload();
            });
        }

        function save() { localStorage.setItem('ice_v94', JSON.stringify(db)); }
        function renderGestion() {
            const box = document.getElementById('boxGestion'); box.innerHTML = "";
            db.promos.forEach((p, i) => {
                box.innerHTML += `<div class="flex justify-between p-3 bg-gray-50 rounded-xl mb-1 text-xs"><span>${p.nombre}</span><button onclick="db.promos.splice(${i},1);save();renderPromos();renderGestion();" class="text-red-500">×</button></div>`;
            });
        }

        renderPromos();
    </script>
</body>
</html>
