<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heladería POS Pro v9 - Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f2f2f7; user-select: none; -webkit-tap-highlight-color: transparent; }
        .apple-card { background: white; border-radius: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-press:active { transform: scale(0.96); background-color: #e5e5ea; }
        .modal-bg { background-color: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
        .counter-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #f3f4f6; border-radius: 10px; font-weight: bold; }
        .scroll-beauty::-webkit-scrollbar { width: 4px; }
        .scroll-beauty::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 10px; }
    </style>
</head>
<body class="p-4 pb-28 text-gray-800">
    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black tracking-tight text-gray-900">Heladería 🍦</h1>
            <div class="flex gap-2">
                <button onclick="abrirGastos()" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">💸</button>
                <button onclick="abrirHistorialDias()" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">📅</button>
                <button onclick="abrirBitacora()" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">📜</button>
                <button onclick="abrirAjustes()" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">⚙️</button>
            </div>
        </header>

        <!-- PANTALLA TOTAL -->
        <div class="apple-card p-8 mb-6 text-center border-b-4 border-blue-500">
            <span class="text-gray-400 text-[10px] font-black uppercase tracking-[0.2em] block mb-2">Total de la Venta</span>
            <div id="displayTotal" class="text-6xl font-black my-2 text-gray-900 tracking-tighter">$0.00</div>
            <div id="displayLista" class="text-gray-400 text-xs font-medium h-4 truncate italic">Esperando productos...</div>
            
            <div class="flex justify-center gap-2 mt-6">
                <button onclick="aplicarDescuento(0)" class="text-[10px] bg-blue-600 text-white px-3 py-1.5 rounded-full font-bold">Normal</button>
                <button onclick="aplicarDescuento(5)" class="text-[10px] bg-gray-100 text-gray-400 px-3 py-1.5 rounded-full font-bold">-5%</button>
                <button onclick="aplicarDescuento(10)" class="text-[10px] bg-gray-100 text-gray-400 px-3 py-1.5 rounded-full font-bold">-10%</button>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-6">
                <button onclick="abrirPago()" class="bg-green-500 text-white font-black py-5 rounded-[20px] btn-press text-lg uppercase tracking-widest">Cobrar</button>
                <button onclick="borrarUltimo()" class="bg-gray-100 text-gray-500 font-bold py-5 rounded-[20px] btn-press text-2xl">←</button>
            </div>
        </div>

        <!-- PRODUCTOS -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button onclick="add('V8', 60)" class="apple-card p-5 btn-press text-left border-l-8 border-blue-400">
                <div class="text-[10px] font-black uppercase text-blue-500">Vainilla 8oz</div>
                <div class="text-2xl font-black">$60</div>
            </button>
            <button onclick="add('C8', 60)" class="apple-card p-5 btn-press text-left border-l-8 border-orange-900">
                <div class="text-[10px] font-black uppercase text-orange-900">Choco 8oz</div>
                <div class="text-2xl font-black">$60</div>
            </button>
            <button onclick="add('V16', 110)" class="apple-card p-5 btn-press text-left border-l-8 border-blue-400">
                <div class="text-[10px] font-black uppercase text-blue-500">Vainilla 16oz</div>
                <div class="text-2xl font-black">$110</div>
            </button>
            <button onclick="add('C16', 130)" class="apple-card p-5 btn-press text-left border-l-8 border-orange-900">
                <div class="text-[10px] font-black uppercase text-orange-900">Choco 16oz</div>
                <div class="text-2xl font-black">$130</div>
            </button>
        </div>

        <div id="gridPromos" class="grid grid-cols-1 gap-3 mb-20"></div>
        <button onclick="abrirResumen()" class="fixed bottom-6 left-6 right-6 bg-blue-600 text-white py-5 rounded-[22px] font-black text-lg shadow-2xl btn-press z-10">Ver Resumen Hoy</button>
    </div>

    <!-- MODAL GASTOS ACTUALIZADO CON TODA TU LISTA -->
    <div id="modalGastos" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-sm rounded-[35px] p-8 shadow-2xl flex flex-col max-h-[85vh]">
            <h3 class="text-2xl font-black mb-4 text-center">Nuevo Gasto</h3>
            <div class="space-y-3 overflow-y-auto pr-2 scroll-beauty">
                <input id="gProv" type="text" placeholder="Proveedor (Costco, Brenda...)" class="w-full p-4 bg-gray-50 rounded-2xl font-bold text-sm">
                <select id="gMet" class="w-full p-4 bg-gray-50 rounded-2xl font-bold text-sm">
                    <option value="Efectivo">Efectivo</option>
                    <option value="Débito">Débito</option>
                    <option value="Transferencia">Transferencia</option>
                </select>
                <select id="gIns" onchange="sugerirGasto()" class="w-full p-4 bg-gray-50 rounded-2xl font-bold text-sm">
                    <option value="">¿Qué compraste?</option>
                    <!-- INGREDIENTES -->
                    <optgroup label="Ingredientes">
                        <option value="Leche" data-p="279">Leche (12kg)</option>
                        <option value="Huevo" data-p="65">Huevo (30 pzs)</option>
                        <option value="Crema Entera" data-p="75.85">Crema Entera (900g)</option>
                        <option value="Vainilla" data-p="319">Vainilla (500ml)</option>
                        <option value="Azúcar Mascabado" data-p="69">Azúcar Mascabado (2kg)</option>
                        <option value="Cocoa" data-p="279">Cocoa (1kg)</option>
                        <option value="Café" data-p="75">Café (60g)</option>
                        <option value="Sal" data-p="10">Sal</option>
                    </optgroup>
                    <!-- MATERIALES / DESECHABLES -->
                    <optgroup label="Desechables">
                        <option value="Desechable 1/2 litro" data-p="34">Desechable 1/2 L (25 pzs)</option>
                        <option value="Tapa Termica" data-p="72">Tapa Térmica (50 pzs)</option>
                        <option value="Desechable 1 litro" data-p="33">Desechable 1 L (15 pzs)</option>
                        <option value="Vaso 8 oz" data-p="16">Vaso 8 oz (25 pzs)</option>
                        <option value="Tapa 8 oz" data-p="29">Tapa 8 oz (50 pzs)</option>
                        <option value="Vaso 4 oz" data-p="14">Vaso 4 oz (25 pzs)</option>
                    </optgroup>
                    <option value="Otros" data-p="0">Otros / Varios</option>
                </select>
                <div class="grid grid-cols-2 gap-3">
                    <div class="text-center">
                        <label class="text-[9px] font-bold text-gray-400 uppercase">Cantidad</label>
                        <input id="gCan" type="number" value="1" oninput="sugerirGasto()" class="w-full p-4 bg-gray-50 rounded-2xl font-bold text-center">
                    </div>
                    <div class="text-center">
                        <label class="text-[9px] font-bold text-gray-400 uppercase">Monto Total $</label>
                        <input id="gTot" type="number" step="0.01" class="w-full p-4 bg-yellow-50 rounded-2xl font-black text-center text-blue-600">
                    </div>
                </div>
                <button onclick="guardarGasto()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black btn-press shadow-lg">Registrar Gasto</button>
            </div>
            <button onclick="cerrarModal('modalGastos')" class="mt-4 text-gray-400 font-bold uppercase text-[10px]">Cerrar</button>
        </div>
    </div>

    <!-- MODAL PAGO -->
    <div id="modalPago" class="fixed inset-0 modal-bg hidden items-end justify-center z-50">
        <div class="bg-white w-full max-w-md rounded-t-[40px] p-10">
            <h3 class="text-2xl font-black mb-8 text-center">Forma de Pago</h3>
            <div class="space-y-4">
                <button onclick="finalizar('Efectivo')" class="w-full py-6 bg-gray-50 rounded-2xl font-black text-xl text-left px-12">💵 Efectivo</button>
                <button onclick="finalizar('Terminal')" class="w-full py-6 bg-gray-100 rounded-2xl font-black text-xl text-left px-12 text-blue-600 border-l-8 border-blue-600">💳 Terminal</button>
                <button onclick="finalizar('Transferencia')" class="w-full py-6 bg-gray-50 rounded-2xl font-black text-xl text-left px-12">🏦 Transferencia</button>
                <button onclick="cerrarModal('modalPago')" class="w-full py-6 text-red-500 font-black">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL RESUMEN -->
    <div id="modalResumen" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-sm rounded-[35px] p-8 shadow-2xl relative text-center">
            <div id="resumenContent" class="min-h-[300px] flex flex-col justify-center"></div>
            <div class="flex justify-between mt-8">
                <button onclick="cambiarPagina(-1)" class="bg-gray-100 p-5 rounded-full font-black text-xl">←</button>
                <button onclick="cambiarPagina(1)" class="bg-gray-100 p-5 rounded-full font-black text-xl">→</button>
            </div>
            <button onclick="abrirConfirmReset()" class="w-full mt-10 text-[10px] text-red-400 font-black uppercase tracking-widest">Cerrar Caja y Guardar Día</button>
            <button onclick="cerrarModal('modalResumen')" class="absolute top-6 right-6 text-gray-300 text-2xl">×</button>
        </div>
    </div>

    <!-- MODALES DE APOYO -->
    <div id="modalBitacora" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4"><div class="bg-white w-full max-w-sm rounded-[30px] p-8 h-[80vh] flex flex-col shadow-2xl"><h3 class="text-2xl font-black mb-4">Ventas de Hoy</h3><div id="listaBitacora" class="flex-1 overflow-y-auto space-y-3 scroll-beauty"></div><button onclick="cerrarModal('modalBitacora')" class="w-full bg-gray-100 py-4 rounded-2xl font-black mt-4">Cerrar</button></div></div>
    <div id="modalHistorialDias" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4"><div class="bg-white w-full max-w-sm rounded-[30px] p-8 h-[70vh] flex flex-col shadow-2xl"><h3 class="text-2xl font-black mb-6">Días Pasados</h3><div id="listaDias" class="flex-1 overflow-y-auto space-y-3 scroll-beauty"></div><button onclick="cerrarModal('modalHistorialDias')" class="w-full bg-gray-100 py-4 rounded-2xl font-black mt-4">Cerrar</button></div></div>
    <div id="modalAjustes" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4"><div class="bg-white w-full max-w-sm rounded-[30px] p-8 max-h-[85vh] overflow-y-auto shadow-2xl"><h3 class="text-2xl font-black mb-6">Ajustes</h3><div class="bg-blue-50 p-5 rounded-[25px] mb-6"><label class="text-[10px] font-black text-blue-400 uppercase block mb-2">Nuevo Botón Promo</label><input id="pNom" type="text" placeholder="Nombre" class="w-full p-4 rounded-2xl mb-2 font-bold"><input id="pPre" type="number" placeholder="Precio $" class="w-full p-4 rounded-2xl mb-4 font-bold"><button onclick="guardarNuevaPromo()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black">Crear Botón</button></div><div id="listaPromosGestion" class="space-y-2 mb-6"></div><button onclick="cerrarModal('modalAjustes')" class="w-full py-2 text-gray-300 font-bold uppercase text-xs">Cerrar</button></div></div>

    <script>
        // ¡IMPORTANTE! REEMPLAZA ESTA URL CON TU NUEVO GOOGLE SCRIPT DE PRUEBA
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwl8xOJxI2mIZ_0y0l_6XF9jbVuAqvEilL8HbstsfG6PKvZSJ45MqUmVtiorlp0bPFngA/exec";

        let carrito = [];
        let pagActual = 0;
        let descuentoPct = 0;

        let db = JSON.parse(localStorage.getItem('heladeria_v9')) || {
            inv: { V8:0, C8:0, V16:0, C16:0 },
            dinero: { efec:0, term:0, tran:0 },
            bitacora: [],
            gastos: [],
            promosConfig: [],
            reportesPasados: []
        };

        function add(tipo, precio) {
            carrito.push({ tipo, precio: Number(precio) });
            actualizarUI();
        }

        function actualizarUI() {
            let base = carrito.reduce((a, b) => a + Number(b.precio), 0);
            let total = base - (base * descuentoPct / 100);
            document.getElementById('displayTotal').innerText = `$${total.toFixed(2)}`;
            document.getElementById('displayLista').innerText = (carrito.length > 0 ? carrito.map(i => i.tipo).join(' + ') : "Carrito vacío");
        }

        function finalizar(metodo) {
            let base = carrito.reduce((a, b) => a + Number(b.precio), 0);
            let totalV = base - (base * descuentoPct / 100);
            const fecha = new Date().toLocaleDateString();
            const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ tipoAccion: "VENTA", fecha, hora, monto: totalV.toFixed(2), metodo, detalle: carrito.map(i => i.tipo).join(', ') }) });

            if(metodo === 'Efectivo') db.dinero.efec += totalV;
            else if(metodo === 'Terminal') db.dinero.term += totalV;
            else if(metodo === 'Transferencia') db.dinero.tran += totalV;

            db.bitacora.push({ hora, monto: totalV, metodo, detalle: carrito.map(i => i.tipo).join(', ') });
            carrito.forEach(i => { if(db.inv[i.tipo] !== undefined) db.inv[i.tipo]++; });
            
            guardarDB(); carrito = []; descuentoPct = 0; actualizarUI(); cerrarModal('modalPago');
        }

        // --- GASTOS ---
        function abrirGastos() { document.getElementById('modalGastos').style.display = 'flex'; }
        function sugerirGasto() {
            const ins = document.getElementById('gIns');
            const pBase = ins.options[ins.selectedIndex].getAttribute('data-p');
            const can = document.getElementById('gCan').value;
            if(pBase) document.getElementById('gTot').value = (pBase * can).toFixed(2);
        }
        function guardarGasto() {
            const proveedor = document.getElementById('gProv').value || "S/P";
            const metodo = document.getElementById('gMet').value;
            const insumo = document.getElementById('gIns').value;
            const cant = document.getElementById('gCan').value;
            const monto = parseFloat(document.getElementById('gTot').value);
            const fecha = new Date().toLocaleDateString();

            if(!insumo || !monto) return alert("Por favor selecciona qué compraste y el monto");

            const datos = { tipoAccion:"GASTO", fecha, proveedor, metodo, concepto: `${cant} ${insumo}`, monto: monto.toFixed(2), pagado: "SI" };
            fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(datos) });

            db.gastos.push({ proveedor, concepto: `${cant} ${insumo}`, total: monto });
            guardarDB();
            cerrarModal('modalGastos');
            alert("Gasto enviado al Excel de prueba");
            
            // Limpiar campos
            document.getElementById('gProv').value = "";
            document.getElementById('gIns').value = "";
            document.getElementById('gTot').value = "";
        }

        // --- CIERRE ---
        function abrirConfirmReset() {
            if(confirm("¿Cerrar el día y guardar reporte financiero?")) {
                const hoy = new Date().toLocaleDateString();
                const totalG = db.gastos.reduce((a, b) => a + b.total, 0);
                
                fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ 
                    tipoAccion: "CIERRE", 
                    fecha: hoy, 
                    efectivo: db.dinero.efec.toFixed(2), 
                    terminal: db.dinero.term.toFixed(2), 
                    transf: db.dinero.tran.toFixed(2), 
                    gastos: totalG.toFixed(2) 
                }) }).then(() => {
                    db.reportesPasados.push({ fecha: hoy, total: (db.dinero.efec + db.dinero.term + db.dinero.tran - ( (db.dinero.efec + db.dinero.term + db.dinero.tran) * 0.5 ) - totalG) });
                    db.inv = { V8:0, C8:0, V16:0, C16:0 }; db.dinero = { efec:0, term:0, tran:0 }; db.bitacora = []; db.gastos = [];
                    guardarDB(); location.reload();
                });
            }
        }

        function renderResumen() {
            const cont = document.getElementById('resumenContent');
            let bruto = db.dinero.efec + db.dinero.term + db.dinero.tran;
            let apartado = bruto * 0.50;
            let totalG = db.gastos.reduce((a, b) => a + b.total, 0);
            let h = "";
            if(pagActual === 0) h = `<h4 class="font-black text-blue-500 mb-6 uppercase text-xs">Ventas Brutas</h4><div class="space-y-4 text-2xl"><div class="flex justify-between border-b"><span>Efectivo</span><b>$${db.dinero.efec.toFixed(2)}</b></div><div class="flex justify-between border-b"><span>Tarjeta</span><b>$${db.dinero.term.toFixed(2)}</b></div><div class="flex justify-between font-black"><span>TOTAL</span><b class="text-blue-600">$${bruto.toFixed(2)}</b></div></div>`;
            else if(pagActual === 1) h = `<h4 class="font-black text-red-500 mb-6 uppercase text-xs">Gastos e Insumos</h4><b class="text-5xl text-red-600 font-black">$${totalG.toFixed(2)}</b><p class="text-gray-400 text-[10px] font-bold uppercase mt-4">Total gastado hoy en materiales</p>`;
            else h = `<h4 class="font-black text-green-500 mb-6 uppercase text-xs">Final (50% Apartado)</h4><div class="space-y-2 text-left text-sm font-bold"><div class="flex justify-between"><span>Bruto Hoy:</span><b>$${bruto.toFixed(2)}</b></div><div class="flex justify-between text-orange-500"><span>Apartado (50%):</span><b>-$${apartado.toFixed(2)}</b></div><div class="flex justify-between text-red-500"><span>Gastos Hoy:</span><b>-$${totalG.toFixed(2)}</b></div><div class="flex justify-between text-2xl font-black pt-4 border-t mt-4"><span>NETO:</span><b class="text-green-600">$${(bruto - apartado - totalG).toFixed(2)}</b></div></div>`;
            cont.innerHTML = h;
        }

        // --- AYUDANTES ---
        function guardarDB() { localStorage.setItem('heladeria_v9', JSON.stringify(db)); }
        function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
        function aplicarDescuento(p) { descuentoPct = p; actualizarUI(); }
        function borrarUltimo() { carrito.pop(); actualizarUI(); }
        function abrirResumen() { pagActual = 0; document.getElementById('modalResumen').style.display = 'flex'; renderResumen(); }
        function cambiarPagina(d) { pagActual = Math.max(0, Math.min(2, pagActual + d)); renderResumen(); }
        function abrirBitacora() { document.getElementById('modalBitacora').style.display = 'flex'; const cont = document.getElementById('listaBitacora'); cont.innerHTML = ""; [...db.bitacora].reverse().forEach((v) => { cont.innerHTML += `<div class="apple-card p-5 border-l-8 border-blue-500 flex justify-between items-center mb-1"><div><span class="text-[10px] font-black text-blue-400">${v.hora}</span><div class="text-lg font-black">$${v.monto.toFixed(2)}</div><div class="text-[10px] text-gray-400 italic">${v.detalle}</div></div></div>`; }); }
        function abrirHistorialDias() { document.getElementById('modalHistorialDias').style.display = 'flex'; const cont = document.getElementById('listaDias'); cont.innerHTML = ""; db.reportesPasados.slice().reverse().forEach(r => { cont.innerHTML += `<div class="bg-gray-100 p-5 rounded-[22px] mb-2"><div class="font-black">${r.fecha}</div><div class="text-blue-600 font-bold">$${r.total.toFixed(2)}</div></div>`; }); }
        function abrirAjustes() { document.getElementById('modalAjustes').style.display = 'flex'; renderListaGestion(); }
        function guardarNuevaPromo() { let n = document.getElementById('pNom').value; let p = document.getElementById('pPre').value; if(n && p) { db.promosConfig.push({ nombre: n, precio: Number(p) }); guardarDB(); renderPromosMain(); renderListaGestion(); document.getElementById('pNom').value = ""; document.getElementById('pPre').value = ""; } }
        function renderPromosMain() { const g = document.getElementById('gridPromos'); g.innerHTML = ""; db.promosConfig.forEach((p) => { g.innerHTML += `<button onclick="add('${p.nombre}', ${p.precio})" class="apple-card p-5 flex justify-between items-center btn-press border-l-8 border-blue-600 shadow-sm"><span class="font-black text-sm text-gray-700">${p.nombre}</span><b class="text-blue-600 text-xl">$${Number(p.precio).toFixed(2)}</b></button>`; }); }
        function renderListaGestion() { const l = document.getElementById('listaPromosGestion'); l.innerHTML = ""; db.promosConfig.forEach((p, i) => { l.innerHTML += `<div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl mb-1"><span class="text-xs font-bold">${p.nombre}</span><button onclick="db.promosConfig.splice(${i},1);guardarDB();renderPromosMain();renderListaGestion();" class="text-red-500 font-black">×</button></div>`; }); }
        function abrirPago() { if(carrito.length > 0) document.getElementById('modalPago').style.display = 'flex'; }

        renderPromosMain();
    </script>
</body>
</html>
